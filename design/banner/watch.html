<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url(cairo-arabic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;src:url(cairo-latin.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0000-00FF,U+2000-206F}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Cairo;background:#09080a;color:#fff;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(55% 40% at 50% 40%,rgba(80,110,170,.35),transparent 70%),radial-gradient(70% 45% at 50% 100%,rgba(243,180,6,.22),transparent 70%)}
.ring{position:absolute;left:190px;top:250px;width:700px;height:700px;border-radius:50%;border:2px solid rgba(243,180,6,.35);box-shadow:0 0 120px rgba(243,180,6,.12) inset}
.logo{position:absolute;top:34px;right:48px;width:150px}
.tag{position:absolute;top:60px;left:48px;padding:10px 26px;border-radius:999px;border:2px solid #F3B406;color:#F3B406;font-weight:900;font-size:32px;direction:ltr}
.w{position:absolute;left:50%;top:230px;height:740px;transform:translateX(-50%) rotate(-6deg);filter:drop-shadow(0 40px 60px rgba(0,0,0,.65))}
.t1{position:absolute;top:960px;left:0;right:0;text-align:center;font-weight:900;font-size:92px;line-height:1.1;direction:ltr}
.t2{position:absolute;top:1062px;left:0;right:0;text-align:center;font-weight:800;font-size:44px;color:#cfd6e6}
.price{position:absolute;top:1132px;left:200px;right:200px;padding:6px 0;border-radius:30px;background:linear-gradient(135deg,#FFE79A,#F3B406 55%,#C98F00);text-align:center;color:#1b1405;font-weight:900;box-shadow:0 20px 50px rgba(243,180,6,.35)}
.price .n{font-size:104px;line-height:1.15;direction:ltr;unicode-bidi:isolate;display:inline-block}.price .c{font-size:46px}
.foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:800;font-size:28px;color:rgba(255,255,255,.7)}
</style></head><body><div class="bg"></div><div class="ring"></div>
<img class="logo" src="logo.png"><div class="tag">46mm</div>
<img class="w" src="watch.png">
<div class="t1">GT 5 Pro</div>
<div class="t2">ساعة ذكية · مقاس 46mm</div>
<div class="price"><span class="n">375,000</span> <span class="c">د.ع</span></div>
<div class="foot">جي فاير للموبايل · النجف · ميلاد · شارع الحولي</div>
</body></html>
