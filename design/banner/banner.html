<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(cairo-arabic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;src:url(cairo-latin.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Cairo,sans-serif;background:#e8e6e2}
.ban{position:relative;width:1200px;height:500px;border-radius:34px;overflow:hidden;color:var(--tx);isolation:isolate}
.A{--tx:#fff;--sub:#CFC7B2;--gold:#F3B406;--gold2:#FFD966;--pill:linear-gradient(135deg,#FFD966,#F3B406);--pilltx:#17140c;--chip:rgba(255,255,255,.07);--chipbd:rgba(243,180,6,.38);
  background:radial-gradient(130% 140% at 90% 10%,rgba(243,180,6,.30),transparent 50%),radial-gradient(90% 120% at 6% 100%,rgba(243,180,6,.07),transparent 60%),linear-gradient(150deg,#15120d,#0a0908)}
.B{--tx:#fff;--sub:#C2D2EE;--gold:#FFD264;--gold2:#FFE08A;--pill:linear-gradient(135deg,#FFD966,#F3B406);--pilltx:#17140c;--chip:rgba(255,255,255,.10);--chipbd:rgba(255,210,100,.38);
  background:radial-gradient(130% 150% at 88% 6%,rgba(70,120,255,.48),transparent 55%),radial-gradient(100% 120% at 4% 100%,rgba(110,55,210,.38),transparent 60%),linear-gradient(145deg,#14234e,#0a1030)}
.C{--tx:#15131a;--sub:#6b6657;--gold:#B88600;--gold2:#F3B406;--pill:linear-gradient(135deg,#1b1a1f,#39342a);--pilltx:#FFD966;--chip:#fff;--chipbd:#ece2c6;
  background:radial-gradient(130% 150% at 88% 4%,rgba(243,180,6,.20),transparent 50%),linear-gradient(145deg,#FCFAF5,#F0ECE3)}
.grain{position:absolute;inset:0;opacity:.45;background-image:radial-gradient(var(--gold) .7px,transparent 1.5px);background-size:28px 28px;-webkit-mask:radial-gradient(130% 120% at 85% 15%,#000,transparent 62%);z-index:0}
.C .grain{opacity:.22}
.ph{position:absolute;bottom:-4%;left:-7%;height:104%;transform:rotate(5deg);transform-origin:bottom left;filter:drop-shadow(0 26px 44px rgba(0,0,0,.5));z-index:1}
.glow{position:absolute;left:4%;top:46%;transform:translateY(-50%);width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,var(--gold2),transparent 62%);opacity:.22;z-index:0}
.B .glow{background:radial-gradient(circle,#6ea0ff,transparent 62%);opacity:.42}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:0 52px;align-items:flex-start;width:64%;margin-right:auto}
.brandrow{display:flex;align-items:center;gap:13px}
.brandrow img{height:50px}
.auth{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--sub);border:1px solid var(--chipbd);border-radius:999px;padding:5px 12px}
.auth svg{width:14px;height:14px}
.titlerow{display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
h1{font-size:52px;font-weight:900;line-height:1;letter-spacing:-.5px;white-space:nowrap;direction:ltr}
.me{font-size:17px;font-weight:900;color:var(--gold);background:var(--chip);border:1px solid var(--chipbd);border-radius:999px;padding:6px 14px;white-space:nowrap}
.sub{font-size:19px;font-weight:700;color:var(--sub)}
.prices{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.pr{display:inline-flex;align-items:center;gap:12px;width:max-content}
.pr .amt{background:var(--pill);color:var(--pilltx);font-weight:900;font-size:25px;padding:8px 20px;border-radius:12px;direction:ltr;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.pr .cap{font-size:19px;font-weight:800;color:var(--tx);background:var(--chip);border:1px solid var(--chipbd);border-radius:10px;padding:7px 15px;direction:ltr}
.chips{display:flex;gap:9px;margin-top:8px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--chip);border:1px solid var(--chipbd);border-radius:14px;padding:9px 13px;min-width:86px}
.chip svg{width:21px;height:21px;color:var(--gold)}
.chip b{font-size:13px;font-weight:800}
.chip span{font-size:11px;color:var(--sub);font-weight:700}
.ribbon{position:absolute;top:20px;left:40px;z-index:3;background:var(--pill);color:var(--pilltx);font-weight:900;font-size:15px;padding:8px 18px;border-radius:999px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
</style></head><body>
<div class="ban THEME">
  <div class="grain"></div><div class="glow"></div>
  <img class="ph" src="iphone.png">
  <div class="ribbon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 10l5 5 5-5"/></svg> اقساط داخل التطبيق</div>
  <div class="wrap">
    <div class="brandrow"><img src="logo.png"><span class="auth"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1c0 1.5-1.2 3-2.7 2.9C13.1 2.4 14.4 1 16 1zm3.3 16.7c-.5 1.2-1.1 2.3-2 3.3-.8.8-1.3 1-2.2 1-.9 0-1.2-.6-2.5-.6s-1.6.6-2.5.6-1.5-.4-2.3-1.2C4.3 18.7 3 15.3 3 12.1c0-2.9 1.9-4.5 3.8-4.5 1 0 1.9.7 2.5.7.6 0 1.6-.8 2.8-.7.5 0 1.9.2 2.8 1.5-2.4 1.5-2 4.9.4 5.6z"/></svg>Authorized Reseller</span></div>
    <div class="titlerow"><h1>iPhone 16 Pro Max</h1><span class="me">شرق أوسط</span></div>
    <div class="sub">احجزه الآن عبر تطبيق جي فاير للموبايل</div>
    <div class="prices">
      <div class="pr"><span class="amt">1,700,000 IQD</span><span class="cap">256 GB</span></div>
      <div class="pr"><span class="amt">1,800,000 IQD</span><span class="cap">512 GB</span></div>
    </div>
    <div class="chips">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg><b>كاميرا</b><span>احترافية</span></div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg><b>A18 Pro</b><span>معالج</span></div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2"/></svg><b>6.9 إنش</b><span>شاشة</span></div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4"/></svg><b>4685 mAh</b><span>بطارية</span></div>
    </div>
  </div>
</div>
</body></html>
