<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(cairo-arabic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;src:url(cairo-latin.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0f22}
.st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo,sans-serif;background:
  radial-gradient(70% 45% at 50% 30%,rgba(243,180,6,.16),transparent 60%),
  radial-gradient(100% 70% at 50% 60%,#16203f,#0a0f22 62%,#060914)}
.dots{position:absolute;inset:0;opacity:.4;background-image:radial-gradient(#F3B406 1px,transparent 1.8px);background-size:34px 34px;-webkit-mask:radial-gradient(85% 70% at 50% 45%,#000,transparent 78%)}
.sw{position:absolute;inset:0;pointer-events:none}
.safe{position:absolute;left:0;right:0;top:230px;bottom:300px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 70px}
.logo{width:270px;margin-top:6px}
.limited{margin-top:16px;display:inline-flex;align-items:center;gap:12px;padding:12px 32px;border-radius:999px;background:rgba(243,180,6,.12);border:2px solid #F3B406;color:#FFD966;font-weight:900;font-size:34px;box-shadow:0 0 36px rgba(243,180,6,.2)}
.head{margin-top:30px;font-size:52px;font-weight:900;color:#fff;line-height:1.25}
.head b{color:#FFD966}
/* prominent reward */
.reward{margin-top:26px;position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:0;padding:30px 80px 34px;border-radius:34px;background:linear-gradient(135deg,#FFE9A8,#F3B406 55%,#D79A05);box-shadow:0 0 80px rgba(243,180,6,.55),0 18px 46px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.65);border:3px solid #FFF0BE}
.reward .lbl{font-size:40px;font-weight:900;color:#5a4206}
.reward .amt{display:flex;align-items:baseline;gap:12px;direction:rtl}
.reward .amt .n{font-size:184px;font-weight:900;line-height:.82;color:#141007;direction:ltr;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.reward .amt .cur{font-size:72px;font-weight:900;color:#2a1f05}
.reward .inst{font-size:40px;font-weight:900;color:#3d2c04;margin-top:4px}
.spark{position:absolute;top:-30px;left:-24px}
.chips{margin-top:34px;display:flex;flex-direction:column;gap:18px;width:100%;align-items:stretch}
.chip{display:inline-flex;align-items:center;gap:20px;padding:22px 36px;border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(243,180,6,.35);font-size:40px;font-weight:800;color:#EDE7D6;text-align:right}
.chip .num{flex-shrink:0;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FFD966,#F3B406);color:#141007;font-weight:900;font-size:36px;display:flex;align-items:center;justify-content:center}
.chip svg{width:40px;height:40px;color:#F3B406;flex-shrink:0}
.chip b{color:#FFD966}
.note{margin-top:30px;display:flex;gap:12px;align-items:flex-start;max-width:900px;padding:18px 26px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:27px;font-weight:600;color:#A9B2C6;line-height:1.5;text-align:right}
.note svg{width:30px;height:30px;color:#F3B406;flex-shrink:0;margin-top:4px}
.phone{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%) rotate(3deg);width:360px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));z-index:2}
.pglow{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);width:480px;height:300px;border-radius:50%;background:radial-gradient(ellipse,rgba(243,180,6,.3),transparent 65%);opacity:.5;z-index:1}
</style></head><body>
<div class="st">
  <div class="dots"></div>
  <svg class="sw" viewBox="0 0 1080 1920" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c6f12"/><stop offset=".5" stop-color="#FFDD77"/><stop offset="1" stop-color="#9c6f12"/></linearGradient></defs>
    <path d="M-40 210 Q 300 100 560 190 T 1120 150" fill="none" stroke="url(#g)" stroke-width="7" opacity=".85"/>
    <path d="M-40 1720 Q 340 1600 620 1700 T 1120 1660" fill="none" stroke="url(#g)" stroke-width="7" opacity=".85"/>
  </svg>
  <div class="pglow"></div>
  <div class="safe">
    <img class="logo" src="logo.png">
    <div class="limited"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M20 12v8a1 1 0 0 1-1 1h-5v-9h6zM10 21H5a1 1 0 0 1-1-1v-8h6v9zM21 7v3H3V7a1 1 0 0 1 1-1h3.5a2.5 2.5 0 1 1 4.5-1.5A2.5 2.5 0 1 1 16.5 6H20a1 1 0 0 1 1 1z"/></svg> هدية لكل تقييم</div>
    <div class="head">قيّم أي منتج اشتريته <b>من التطبيق</b></div>
    <div class="reward">
      <svg class="spark" width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v6M18.4 5.6l-4 4M5.6 5.6l4 4"/></svg>
      <span class="lbl">هدية فورية</span>
      <div class="amt"><span class="cur">د.ع</span><span class="n">5,000</span></div>
      <span class="inst">كود خصم على بريدك</span>
    </div>
    <div class="chips">
      <div class="chip"><span class="num">1</span>اشترِ أي منتج من تطبيق جي فاير</div>
      <div class="chip"><span class="num">2</span>قيّم المنتج بعد ما يوصلك</div>
      <div class="chip"><span class="num">3</span>يوصلك كود الـ<b>5,000 د.ع</b> على بريدك فوراً</div>
    </div>
    <div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
      <span>يوصلك طلب التقييم على بريدك الإلكتروني. بعد ما تدخل وتقيّم مباشرة، النظام يعطيك كود خصم 5,000 د.ع.</span></div>
  </div>
  <img class="phone" src="iphone.png">
</div>
</body></html>
