<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url(cairo-arabic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:Cairo;src:url(cairo-latin.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0000-00FF,U+2000-206F}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;font-family:Cairo;background:#0b0710;color:#fff;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 22%,rgba(214,70,160,.55),transparent 70%),radial-gradient(60% 40% at 15% 90%,rgba(243,180,6,.22),transparent 70%),radial-gradient(60% 40% at 90% 75%,rgba(120,70,220,.35),transparent 70%)}
.logo{position:absolute;top:30px;right:48px;width:150px}
.tag{position:absolute;top:66px;left:48px;padding:10px 26px;border-radius:999px;border:2px solid #F3B406;color:#F3B406;font-weight:900;font-size:30px;direction:ltr}
.art{position:absolute;top:196px;left:60px;width:960px;height:456px;border-radius:30px;overflow:hidden;border:5px solid #F3B406;box-shadow:0 30px 80px rgba(214,70,160,.45)}
.art img{width:100%;height:100%;object-fit:cover}
.t1{position:absolute;top:676px;left:0;right:0;text-align:center;font-weight:900;font-size:104px;line-height:1.1}
.t1 b{color:#F3B406;direction:ltr;unicode-bidi:isolate;display:inline-block}
.t2{position:absolute;top:804px;left:0;right:0;text-align:center;font-weight:900;font-size:62px;color:#ffd9f0}
.price{position:absolute;top:908px;left:170px;right:170px;padding:14px 0;border-radius:34px;background:linear-gradient(135deg,#FFE79A,#F3B406 55%,#C98F00);text-align:center;color:#1b1405;font-weight:900;box-shadow:0 20px 50px rgba(243,180,6,.4)}
.price .n{font-size:128px;line-height:1;direction:ltr;unicode-bidi:isolate;display:inline-block}.price .c{font-size:54px}
.strip{position:absolute;top:1092px;left:120px;right:120px;padding:8px 0;border-radius:20px;border:2.5px solid #F3B406;background:rgba(243,180,6,.12);text-align:center;font-weight:900;font-size:44px;color:#fff}.strip b{color:#F3B406}
.chips{position:absolute;top:1198px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.chips span{padding:8px 24px;border-radius:14px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);font-weight:800;font-size:30px}
.foot{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-weight:800;font-size:30px;color:rgba(255,255,255,.75)}
</style></head><body><div class="bg"></div>
<img class="logo" src="logo.png"><div class="tag">PS5 · Standard Edition</div>
<div class="art"><img src="gta_art.jpg"></div>
<div class="t1">تنزيل <b>GTA VI</b></div>
<div class="t2">على نفس حسابك</div>
<div class="price"><span class="n">150,000</span> <span class="c">د.ع</span></div>
<div class="strip">مع إمكانية <b>تحميلها داخل الشركة</b></div>
<div class="chips"><span>حجز مسبق</span><span>نسخة رقمية أصلية</span><span>تحميل مسبق</span></div>
<div class="foot">جي فاير للموبايل · النجف · ميلاد · شارع الحولي</div>
</body></html>
